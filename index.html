<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>The Legend Of Maajid</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #05070a;
      color: #e2e8f0;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    }

    #game-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at center, #111827 0%, #030712 100%);
    }

    canvas {
      display: block;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 20px rgba(217, 119, 6, 0.15);
      border-radius: 4px;
    }

    /* Mobile portrait advisory */
    #orientation-warning {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: rgba(3, 7, 18, 0.96);
      backdrop-filter: blur(10px);
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      color: #f1f5f9;
    }

    #orientation-warning .icon {
      font-size: 54px;
      margin-bottom: 16px;
      animation: rotate-hint 2s infinite ease-in-out;
    }

    #orientation-warning h2 {
      font-family: 'Cinzel', serif;
      font-size: 22px;
      color: #f59e0b;
      margin-bottom: 8px;
      letter-spacing: 1.5px;
    }

    #orientation-warning p {
      font-size: 14px;
      color: #94a3b8;
      max-width: 320px;
      line-height: 1.5;
    }

    @keyframes rotate-hint {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(90deg); }
    }

    @media screen and (orientation: portrait) and (max-width: 820px) {
      #orientation-warning {
        display: flex;
      }
    }
  </style>
</head>
<body>
  <div id="game-container"></div>

  <div id="orientation-warning">
    <div class="icon">🔄</div>
    <h2>ROTATE YOUR DEVICE</h2>
    <p>For the optimal cinematic RPG experience of <strong>The Legend Of Maajid</strong>, please switch your mobile device to Landscape mode.</p>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
